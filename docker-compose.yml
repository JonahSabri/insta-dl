version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - downloads_vol:/app/downloads
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./instadb.sqlite
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
      - DEBUG=false
      - ALLOWED_ORIGINS=http://localhost:3000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - GUEST_DAILY_LIMIT=${GUEST_DAILY_LIMIT:-3}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_SITE_NAME=${SITE_NAME:-InstaGet}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  downloads_vol:
